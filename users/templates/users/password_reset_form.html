{% extends "base.html" %}
{% load i18n static %}


{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
<p>{% translate 'Forgotten your password? Enter your email address below, and we’ll email instructions for setting a new one.' %}</p>

<form method="post">{% csrf_token %}
  <fieldset class="module aligned">
    <div class="form-row field-email">
      <div class="flex-container">
        <label for="id_email">{% translate 'Email address:' %}</label>
        {{ form.email.errors }}
        {{ form.email }}
      </div>
    </div>
  </fieldset>
  <div class="submit-row mt-3">
    <input type="submit" value="{% translate 'Reset my password' %}" class="btn btn-primary w-75">
  </div>
</form>
</div>
</div>
{% endblock %}
