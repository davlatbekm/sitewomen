{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6">
            <p>New Password</p>
            <form method="post">
                {% csrf_token %}
                {% for f in form %}
                    <p><label for="{{ f.id_for_label }}">{{ f.label }}</label>{{ f }}</p>
                    {% if f.errors %}
                        <div class="alert alert-danger">{{ f.errors }}</div>
                    {% endif %}
                {% endfor %}
                <button type="submit" class="btn btn-primary w-75">Save</button>
            </form>

    </div>
</div>
{% endblock %}
